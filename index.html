<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>寂庙无声 - 解谜互动故事</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            background-image: url('assets/background.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            backdrop-filter: blur(5px);
            color: #e0e0e0;
            font-family: 'Georgia', serif;
        }

        .overlay {
            background-color: rgba(0, 0, 0, 0.75);
            min-height: 100vh;
            padding-bottom: 50px;
        }

        .header {
            background-color: #1e1e1e;
            padding: 20px;
            position: sticky;
            top: 0;
            z-index: 10;
            border-bottom: 2px solid #333;
            box-shadow: 0 2px 5px rgba(0,0,0,0.7);
            text-align: center;
        }

        .title {
            font-size: 2.5em;
            color: #e67e22;
            margin-bottom: 10px;
            text-shadow: 1px 1px 2px black;
        }

        .search-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
        }

        .search-bar {
            width: 300px;
            padding: 10px;
            border: none;
            border-radius: 4px;
            font-size: 1em;
            background-color: #2c2c2c;
            color: #fff;
            box-shadow: 0 0 5px #e67e22;
        }

        .search-button {
            padding: 10px 20px;
            font-size: 1em;
            background-color: #e67e22;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .content-container {
            display: flex;
            justify-content: center;
            padding: 40px 20px 20px;
        }

        .story-box {
            max-width: 750px;
            background-color: #1a1a1a;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(230, 126, 34, 0.4);
            line-height: 1.8;
            font-size: 1.2em;
            white-space: pre-line;
            border-left: 4px solid #e67e22;
        }

        .error-text {
            text-align: center;
            margin-top: 20px;
            font-size: 1em;
            color: #e74c3c;
        }

        .hint-button {
            margin-top: 20px;
            background-color: #444;
            color: #fff;
            padding: 8px 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .return-button {
            margin-top: 20px;
            background-color: #555;
            color: white;
            padding: 8px 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
<div class="overlay">
    <div class="header">
        <div class="title">🕯️ 寂庙无声</div>
        <div class="search-container">
            <input type="text" id="keyword-input" class="search-bar" placeholder="请输入关键词，如：禅房">
            <button class="search-button" onclick="checkKeyword()">确认</button>
        </div>
    </div>

    <div class="content-container">
        <div class="story-box" id="story-box"></div>
    </div>

    <div class="error-text" id="error-box"></div>
</div>

<script>
    const stages = [
        {
            id: "intro",
            text: "你误入江南深山中的一座古庙『云隐寺』。\n山雨欲来，庙门轰然关闭，你被困其中。\n\n香案旁残留的灰烬中，浮现几个字句：\n\n“尘生眼，火净心，欲问彼身往何层？”\n数字：6，12，3，18\n\n地板缝中一柄纸扇，其上写：『坐中无我境』",
            keyword: "禅房",
            next: "zen_room",
            hints: [
                "‘坐中无我’是佛教术语，指的是某种修行状态。数字可能代表笔画数或偏旁……‘禅房’二字都在其中。答案是你能修行的地方。"
            ]
        },
        {
            id: "zen_room",
            text: "你来到禅房，屋内一片死寂。\n一幅对联被撕掉一半，只剩：『心中有声不成声』。\n床下破书页上，隐约写着两个字：『无』与『？』。\n\n这二字被反复涂抹，像是某人挣扎着想要发出声音。",
            keyword: "无声",
            next: "stone_forest",
            hints: [
                "‘有声不成声’，暗示有人说不出话？",
                "佛门讲‘空’，但这里反复强调‘无法发声’。",
                "这个词出现在破书中，也可能是这个人的状态。"
            ]
        },
        {
            id: "stone_forest",
            text: "碑林中，一块石碑的字刻反了。\n你凑近阅读，上面写着：『选经落榜者……永不得言。』\n\n某些字后面似乎被改过，尤其是两个名字 —— 其中之一是：『净〇』。",
            keyword: "净远",
            next: "soul_lantern",
            hints: [
                "‘选经’是佛门晋升仪式，未被选中的弟子如何？",
                "净远 = 清净 + 永远？或是名字？",
                "你可能已见过这个名字的残片。"
            ]
        },
        {
            id: "soul_lantern",
            text: "你来到心灯阁。\n四盏灯以奇怪顺序排列：西、南、北、东。\n正中祭台刻着‘归’与‘寂’两字，但少一字不成咒。\n\n耳边传来低语：「……归？何处归……」",
            keyword: "归寂",
            next: "ending",
            hints: [
                "‘寂’在佛教中代表涅槃或死亡。",
                "‘归寂’是安魂仪式。",
                "这正是你所执行的最后仪式名称。"
            ]
        },
        {
            id: "ending",
            text: "ENDING_PLACEHOLDER", // 替换为真实结局
            keyword: null,
            next: null
        },

        // 分支：斋堂
        {
            id: "branch_dining",
            text: "你进入斋堂，一口冷锅上还残留未洗净的米粒。\n角落一本油渍纸本写着：\n「净远又被关禁，不许开口……只因他问了‘为何我不可被选？’」",
            keyword: null,
            isBranch: true
        },

        // 分支：方丈
        {
            id: "branch_master",
            text: "你走进方丈室，抽屉里有封未寄出的信：\n\n「净远本可成材，奈何规矩不能破。我亦悔矣……」\n\n你意识到这场沉默，是制度制造的杀机。",
            keyword: null,
            isBranch: true
        }
    ];

    let currentStage = "intro";
    let lastMainStage = "intro";
    let hintIndex = 0;
    let visitedBranches = new Set();

    function updateStage() {
        const stage = stages.find(s => s.id === currentStage);
        const storyBox = document.getElementById("story-box");
        const errorBox = document.getElementById("error-box");
        errorBox.textContent = '';
        storyBox.innerHTML = '';

        // 判断是否是结局
        if (currentStage === "ending") {
            const trueEnding = visitedBranches.size > 0;
            storyBox.textContent = trueEnding
                ? "你轻声念出：归寂。\n\n烛光摇曳，净远的身影浮现。\n\n他终于被听见，也终于被理解。\n\n你看到他嘴角微笑，轻轻低头。\n\n寺庙门缓缓开启，一切归于寂静。"
                : "你轻声念出：归寂。\n\n烛光熄灭，一个模糊的身影渐行渐远……\n\n你知道你释放了他，但你从未真正理解过他。\n\n门开了，雾中你转身离去，心中仍有沉重。";
            return;
        }

        storyBox.textContent = stage.text;

        // 渲染提示按钮
        if (stage.hints) {
            const hintBtn = document.createElement("button");
            hintBtn.textContent = "提示";
            hintBtn.className = "hint-button";
            hintBtn.onclick = () => {
                if (hintIndex < stage.hints.length) {
                    document.getElementById("error-box").textContent = "💡 " + stage.hints[hintIndex++];
                } else {
                    document.getElementById("error-box").textContent = "✅ 所有提示已显示。";
                }
            };
            storyBox.appendChild(document.createElement("br"));
            storyBox.appendChild(hintBtn);
        }

        // 支线返回按钮
        if (stage.isBranch) {
            const returnBtn = document.createElement("button");
            returnBtn.textContent = "← 返回主线";
            returnBtn.className = "return-button";
            returnBtn.onclick = () => {
                currentStage = lastMainStage;
                updateStage();
            };
            storyBox.appendChild(document.createElement("br"));
            storyBox.appendChild(returnBtn);
        }
    }

    function checkKeyword() {
        const input = document.getElementById("keyword-input").value.trim().toLowerCase();
        const stage = stages.find(s => s.id === currentStage);
        document.getElementById("keyword-input").value = '';
        hintIndex = 0;

        // 主线关键词
        if (stage.keyword && input === stage.keyword.toLowerCase()) {
            lastMainStage = stage.next;
            currentStage = stage.next;
            updateStage();
            return;
        }

        // 支线关键词
        if (input === "斋堂") {
            visitedBranches.add("斋堂");
            lastMainStage = currentStage;
            currentStage = "branch_dining";
            updateStage();
            return;
        }

        if (input === "方丈") {
            visitedBranches.add("方丈");
            lastMainStage = currentStage;
            currentStage = "branch_master";
            updateStage();
            return;
        }

        document.getElementById("error-box").textContent = "❌ 无效关键词，请再试一次或点击提示。";
    }

    window.onload = updateStage;
</script>

</body>
</html>
